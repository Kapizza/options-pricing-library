[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "options-pricing-library"
version = "0.1.0"
description = "Option pricing, Greeks, volatility models, calibration and risk tools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "scikit-learn>=1.2",
]

[project.optional-dependencies]
data = ["yfinance>=0.2.51"]
numba = ["numba>=0.58"]
notebooks = ["jupyter", "ipywidgets", "yfinance>=0.2.51"]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["src", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running Monte Carlo tests (deselect with -m 'not slow')",
]
